<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSA Admin Dashboard</title>
    <link rel="icon" type="image/png" href="Images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            800: '#064e3b',
                            900: '#022c22',
                        },
                        pakistan: {
                            dark: '#004b23',
                            light: '#007200',
                            gold: '#d4af37'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-emerald-900 via-pakistan-dark to-emerald-800 min-h-screen p-4 md:p-10 font-sans text-slate-100 relative overflow-x-hidden select-none">
    
    <div class="max-w-6xl mx-auto relative z-10 animate-fade-in">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl font-black text-white tracking-tight">Admin Dashboard</h1>
                <p class="text-pakistan-gold font-bold tracking-widest uppercase text-sm mt-1">Manage and export all active RSVPs</p>
            </div>
            <div class="flex gap-3">
                <button id="exportCSV" class="bg-white text-emerald-900 font-black px-6 py-2.5 rounded-xl shadow-md hover:bg-emerald-50 transition-all duration-300 flex items-center gap-2 active:scale-95">
                    <span>Export CSV</span>
                </button>
                <button id="clearAll" class="bg-red-600 hover:bg-red-700 text-white font-black px-6 py-2.5 rounded-xl shadow-md transition-all duration-300 active:scale-95">
                    Clear Data
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-2xl border-t-4 border-pakistan">
                <p class="text-gray-500 text-xs font-black uppercase tracking-widest">Total RSVPs</p>
                <p id="totalCount" class="text-4xl font-black text-emerald-900 mt-1">0</p>
            </div>
        </div>

        <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden border-t-4 border-pakistan">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-emerald-50/70 border-b border-emerald-100">
                        <tr>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Attendee</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Hofstra ID</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Guests</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Submission Date</th>
                        </tr>
                    </thead>
                    <tbody id="rsvpTableBody" class="divide-y divide-gray-100 text-gray-700">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const API_BASE = "https://rsvp-backend-5b7q.onrender.com";     
    const tableBody = document.getElementById("rsvpTableBody");
    const totalCountEl = document.getElementById("totalCount");
    const exportBtn = document.getElementById("exportCSV");
    const clearBtn  = document.getElementById("clearAll");

    async function loadRSVPs() {
        tableBody.innerHTML = "";
        try {
            const r = await fetch(`${API_BASE}/rsvps`);
            const list = await r.json();

            if (Array.isArray(list)) {
                totalCountEl.textContent = list.length;
            } else {
                totalCountEl.textContent = "0";
            }

            if (!Array.isArray(list) || list.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-10 text-center italic text-gray-400">No RSVPs yet.</td></tr>`;
                return;
            }

            for (const e of list) {
                const guests = [];
                
                if (e.guest1fname || e.guest1lname) {
                    guests.push(`${e.guest1fname || ""} ${e.guest1lname || ""}`.trim());
                }

                if (e.guest2fname || e.guest2lname) {
                    guests.push(`${e.guest2fname || ""} ${e.guest2lname || ""}`.trim());
                }

                const tr = document.createElement("tr");
                tr.className = "hover:bg-emerald-50/30 transition-colors duration-200";
                
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-black text-emerald-900 text-lg">${(e.fname || "")} ${(e.lname || "")}</div>
                        <div class="text-xs text-gray-400 font-medium">${e.email || ""}</div>
                    </td>
                    <td class="px-6 py-4 font-mono text-base font-bold text-gray-600">${e.hofstraId || "N/A"}</td>
                    <td class="px-6 py-4">
                        ${guests.length > 0 
                            ? `<div class="flex flex-col gap-1.5">${guests.map(g => `<span class="bg-emerald-50 border border-emerald-100 text-emerald-900 px-2.5 py-1 rounded-lg text-xs font-black uppercase tracking-wide w-max shadow-sm">${g}</span>`).join("")}</div>` 
                            : `<span class="text-gray-400 italic text-sm">None</span>`
                        }
                    </td>
                    <td class="px-6 py-4 text-sm font-bold text-gray-500">${e.submitTime ? new Date(e.submitTime).toLocaleDateString() : "N/A"}</td>
                `;
                tableBody.appendChild(tr);
            }
        } 
        catch (err) {
            console.error(err);
            alert("Failed to load RSVPs");
        }
    }

    function exportCSV() {
        window.location.href = `${API_BASE}/export.csv`;
    }

    async function clearEntries() {
        if (!confirm("Delete ALL RSVP entries? This cannot be undone.")) {
            return;
        }
        try {
            await fetch(`${API_BASE}/rsvps`, { method: "DELETE" });
            loadRSVPs();
        } 
        catch (err) {
            console.error(err);
            alert("Failed to clear");
        }
    }

    exportBtn?.addEventListener("click", exportCSV);
    clearBtn?.addEventListener("click", clearEntries);
    window.addEventListener("DOMContentLoaded", loadRSVPs);
</script>
</body>
</html>
