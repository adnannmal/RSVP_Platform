<!DOCTYPE html> <!--recognizes file type as HTML-->

<html lang="en"> <!--sets language to english-->

<head>
    <meta charset="UTF-8" /> <!--tells web browser to interpret doc using UTF-8 encoding-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!--allows for mobile compatibility-->
    <title>PSA Admin Dashboard</title> <!--Title shown in browser tab-->
    <link rel="icon" type="image/png" href="Images/logo.png" /> <!-- Tab icon -->
    <link rel="stylesheet" href="style.css" /> <!-- Custom CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            800: '#064e3b',
                            900: '#022c22',
                        },
                        pakistan: {
                            dark: '#004b23',
                            light: '#007200',
                            gold: '#d4af37'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-emerald-800 min-h-screen p-4 md:p-10 font-sans text-slate-100 relative overflow-x-hidden select-none">

    <!-- Admin PIN Gate -->

    <div id="pinGate" class="max-w-md mx-auto relative z-10 animate-fade-in min-h-[85vh] flex items-center justify-center">
        <div class="bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-2xl border-t-4 border-pakistan-gold w-full">
            <div class="text-center mb-6">
                <h1 class="text-4xl font-black text-emerald-900 tracking-tight">Admin Access</h1>
                <p class="text-pakistan-gold font-bold tracking-widest uppercase text-sm mt-1">Enter PIN to view dashboard</p>
            </div>

            <input id="adminPinInput" type="password" placeholder="Enter admin PIN" class="w-full px-5 py-3 rounded-xl border-2 border-emerald-100 text-emerald-900 font-bold outline-none focus:border-pakistan-gold transition-all duration-300 mb-4" />

            <button id="unlockAdmin" class="w-full bg-emerald-900 hover:bg-emerald-800 text-white font-black px-6 py-3 rounded-xl shadow-md transition-all duration-300 active:scale-95">
                Unlock Dashboard
            </button>

            <p id="pinError" class="hidden text-red-600 text-sm font-bold text-center mt-4">Incorrect PIN. Try again.</p>
        </div>
    </div>

    <div id="adminDashboard" class="hidden max-w-6xl mx-auto relative z-10 animate-fade-in">
        
        <!-- Dashboard Header -->

        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl font-black text-white tracking-tight">Admin Dashboard</h1>
                <p class="text-pakistan-gold font-bold tracking-widest uppercase text-sm mt-1">Manage and export all active RSVPs</p>
            </div>
            <div class="flex gap-3">
                <button id="exportCSV" class="bg-white text-emerald-900 font-black px-6 py-2.5 rounded-xl shadow-md hover:bg-emerald-50 transition-all duration-300 flex items-center gap-2 active:scale-95">
                    <span>Export CSV</span>
                </button>
                <button id="clearAll" class="bg-red-600 hover:bg-red-700 text-white font-black px-6 py-2.5 rounded-xl shadow-md transition-all duration-300 active:scale-95">
                    Clear Data
                </button>
                <button id="logoutAdmin" class="bg-pakistan-gold text-emerald-900 font-black px-6 py-2.5 rounded-xl shadow-md hover:opacity-90 transition-all duration-300 active:scale-95">
                    Logout
                </button>
            </div>
        </div>

        <!-- RSVP Summary and Table -->

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-2xl border-t-4 border-pakistan-gold">
                <p class="text-gray-500 text-xs font-black uppercase tracking-widest">Total RSVPs</p>
                <p id="totalCount" class="text-4xl font-black text-emerald-900 mt-1">0</p>
            </div>
        </div>

        <!-- RSVP Table -->

        <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden border-t-4 border-pakistan-gold">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-emerald-50/70 border-b border-emerald-100">
                        <tr>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Attendee</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Hofstra ID</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Guests</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Status</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Submission Time</th>
                            <th class="px-6 py-4 text-xs font-black text-emerald-900 uppercase tracking-widest">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rsvpTableBody" class="divide-y divide-gray-100 text-gray-700">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const API_BASE = "https://rsvp-backend-5b7q.onrender.com";     

    const pinGate = document.getElementById("pinGate");
    const adminDashboard = document.getElementById("adminDashboard");
    const pinInput = document.getElementById("adminPinInput");
    const pinError = document.getElementById("pinError");
    const unlockBtn = document.getElementById("unlockAdmin");
    const logoutBtn = document.getElementById("logoutAdmin");

    const tableBody = document.getElementById("rsvpTableBody");
    const totalCountEl = document.getElementById("totalCount");
    const exportBtn = document.getElementById("exportCSV");
    const clearBtn  = document.getElementById("clearAll");

    let adminPin = sessionStorage.getItem("adminPin") || "";

    function showDashboard() { // Show admin dashboard after PIN is verified
        pinGate.classList.add("hidden");
        adminDashboard.classList.remove("hidden");
        loadRSVPs();
    }

    function logoutAdmin() { // Remove saved PIN and return to PIN screen
        sessionStorage.removeItem("adminPin");
        adminPin = "";
        adminDashboard.classList.add("hidden");
        pinGate.classList.remove("hidden");
        pinInput.value = "";
        pinError.classList.add("hidden");
        tableBody.innerHTML = "";
        totalCountEl.textContent = "0";
    }

    async function checkAdminPin() { // Send PIN to backend for verification
        const pin = pinInput.value.trim();
        pinError.classList.add("hidden");

        if (!pin) {
            pinError.textContent = "Please enter the admin PIN.";
            pinError.classList.remove("hidden");
            return;
        }

        try {
            const r = await fetch(`${API_BASE}/verify-pin`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ pin })
            });

            const data = await r.json();

            if (!r.ok || (!data.ok && !data.success)) {
                pinError.textContent = "Incorrect PIN. Try again.";
                pinError.classList.remove("hidden");
                return;
            }

            adminPin = pin;
            sessionStorage.setItem("adminPin", pin);
            showDashboard();
        }
        catch (err) {
            console.error(err);
            pinError.textContent = "Could not connect to server. Try again.";
            pinError.classList.remove("hidden");
        }
    }

    async function approveRSVP(id) { // Approve RSVP and send confirmation email
        if (!confirm("Approve this RSVP and send the confirmation email?")) {
            return;
        }

        try {
            const r = await fetch(`${API_BASE}/rsvps/${id}/approve`, {
                method: "PATCH",
                headers: {
                    "x-admin-pin": adminPin
                }
            });

            const data = await r.json();

            if (!r.ok) {
                throw new Error(data.detail || "Failed to approve RSVP.");
            }

            alert(data.message || "RSVP approved.");
            loadRSVPs();
        }
        catch (err) {
            console.error(err);
            alert(err.message || "Failed to approve RSVP.");
        }
    }

    async function rejectRSVP(id) { // Reject RSVP
        if (!confirm("Reject this RSVP?")) {
            return;
        }

        try {
            const r = await fetch(`${API_BASE}/rsvps/${id}/reject`, {
                method: "PATCH",
                headers: {
                    "x-admin-pin": adminPin
                }
            });

            const data = await r.json();

            if (!r.ok) {
                throw new Error(data.detail || "Failed to reject RSVP.");
            }

            alert(data.message || "RSVP rejected.");
            loadRSVPs();
        }
        catch (err) {
            console.error(err);
            alert(err.message || "Failed to reject RSVP.");
        }
    }

    window.approveRSVP = approveRSVP;
    window.rejectRSVP = rejectRSVP;

    async function loadRSVPs() { // Fetch and display RSVPs in the table
        tableBody.innerHTML = "";

        try {
            const r = await fetch(`${API_BASE}/rsvps`, {
                headers: {
                    "x-admin-pin": adminPin
                }
            });

            if (!r.ok) {
                throw new Error("Unauthorized or failed to load RSVPs.");
            }

            const list = await r.json();

            if (Array.isArray(list)) {
                totalCountEl.textContent = list.length;
            } 
            else {
                totalCountEl.textContent = "0";
            }

            if (!Array.isArray(list) || list.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center italic text-gray-400">No RSVPs yet.</td></tr>`;
                return;
            }

            for (const e of list) { // Build table rows for each RSVP entry
                const guests = [];
                
                if (e.guest1fname || e.guest1lname) {
                    guests.push(`${e.guest1fname || ""} ${e.guest1lname || ""}`.trim());
                }

                if (e.guest2fname || e.guest2lname) {
                    guests.push(`${e.guest2fname || ""} ${e.guest2lname || ""}`.trim());
                }

                const status = e.approvalStatus || "pending";

                let statusBadge = "";

                if (status === "approved") {
                    statusBadge = `<span class="bg-green-100 text-green-800 border border-green-200 px-3 py-1 rounded-lg text-xs font-black uppercase">Approved</span>`;
                }
                else if (status === "rejected") {
                    statusBadge = `<span class="bg-red-100 text-red-800 border border-red-200 px-3 py-1 rounded-lg text-xs font-black uppercase">Rejected</span>`;
                }
                else if (status === "waitlisted") {
                    statusBadge = `<span class="bg-blue-100 text-blue-800 border border-blue-200 px-3 py-1 rounded-lg text-xs font-black uppercase">Waitlisted</span>`;
                }
                else {
                    statusBadge = `<span class="bg-yellow-100 text-yellow-800 border border-yellow-200 px-3 py-1 rounded-lg text-xs font-black uppercase">Pending</span>`;
                }

                let actionButtons = "";

                if (status === "pending" || status === "waitlisted") {
                    actionButtons = `
                        <div class="flex gap-2">
                            <button onclick="approveRSVP('${e.id}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-black">
                                ${status === "waitlisted" ? "Approve from Waitlist" : "Approve"}
                            </button>
                            <button onclick="rejectRSVP('${e.id}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-black">
                                Reject
                            </button>
                        </div>
                    `;
                }
                else {
                    actionButtons = `<span class="text-gray-400 italic text-sm">No action</span>`;
                }

                const tr = document.createElement("tr");
                tr.className = "hover:bg-emerald-50/30 transition-colors duration-200";
                
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-black text-emerald-900 text-lg">${(e.fname || "")} ${(e.lname || "")}</div>
                        <div class="text-xs text-gray-400 font-medium">${e.email || ""}</div>
                    </td>
                    <td class="px-6 py-4 font-mono text-base font-bold text-gray-600">${e.hofstraId || "N/A"}</td>
                    <td class="px-6 py-4">
                        ${guests.length > 0 
                            ? `<div class="flex flex-col gap-1.5">${guests.map(g => `<span class="bg-emerald-50 border border-emerald-100 text-emerald-900 px-2.5 py-1 rounded-lg text-xs font-black uppercase tracking-wide w-max shadow-sm">${g}</span>`).join("")}</div>` 
                            : `<span class="text-gray-400 italic text-sm">None</span>`
                        }
                    </td>
                    <td class="px-6 py-4">${statusBadge}</td>
                    <td class="px-6 py-4 text-sm font-bold text-gray-500">${e.submitTime || "N/A"}</td>
                    <td class="px-6 py-4">${actionButtons}</td>
                `;

                tableBody.appendChild(tr);
            }
        } 
        catch (err) {
            console.error(err);
            tableBody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-red-600 font-bold">Failed to load RSVPs. Please log in again.</td></tr>`;
            sessionStorage.removeItem("adminPin");
        }
    }

    async function exportCSV() { // Export RSVP data as CSV with admin PIN header
        try {
            const r = await fetch(`${API_BASE}/export.csv`, {
                headers: {
                    "x-admin-pin": adminPin
                }
            });

            if (!r.ok) {
                throw new Error("Failed to export CSV.");
            }

            const blob = await r.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            a.download = `rsvp_export_${new Date().toISOString().split("T")[0]}.csv`;

            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);
        }
        catch (err) {
            console.error(err);
            alert("Failed to export CSV.");
        }
    }

    async function clearEntries() { // Delete all RSVP entries with admin PIN header
        if (!confirm("Delete ALL RSVP entries? This cannot be undone.")) {
            return;
        }

        try {
            const r = await fetch(`${API_BASE}/rsvps`, {
                method: "DELETE",
                headers: {
                    "x-admin-pin": adminPin
                }
            });

            if (!r.ok) {
                throw new Error("Failed to clear RSVP data.");
            }

            alert("All RSVP entries were cleared.");
            loadRSVPs();
        } 
        catch (err) {
            console.error(err);
            alert("Failed to clear data.");
        }
    }

    unlockBtn?.addEventListener("click", checkAdminPin);
    exportBtn?.addEventListener("click", exportCSV);
    clearBtn?.addEventListener("click", clearEntries);
    logoutBtn?.addEventListener("click", logoutAdmin);

    pinInput?.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            checkAdminPin();
        }
    });

    window.addEventListener("DOMContentLoaded", function () {
        if (adminPin) {
            showDashboard();
        }
    });
</script>
</body>
</html>
