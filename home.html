<!DOCTYPE html> <!--recognizes file type as HTML-->

<html lang="en"> <!--sets language to english-->

<head>
    <meta charset="UTF-8" /> <!--tells web browser to interpret doc using UTF-8 encoding-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!--allows for mobile compatibility-->
    <title>PSA RSVP Form</title> <!--Title shown in browser tab-->
    <link rel="icon" type="image/png" href="Images/logo.png" /> <!-- Tab icon -->
    <link rel="stylesheet" href="style.css" /> <!-- Custom CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script> <!--loads tailwind for styling-->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            800: '#064e3b',
                            900: '#022c22',
                        },
                        pakistan: {
                            dark: '#004b23',
                            light: '#007200',
                            gold: '#d4af37'
                        }
                    }
                }
            }
        }
    </script>
</head>

<!--full screen layout with green background and centered content--> 

<body class="bg-gradient-to-br from-emerald-900 via-pakistan-dark to-emerald-800 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden select-none">
    
    <!--flag pictures-->

    <img src="Images/pakistan_flag.png" alt="leftFlag" class="hidden sm:block fixed top-6 left-6 w-24 md:w-32 transform -rotate-12 opacity-80 pointer-events-none drop-shadow-md z-0" />
    <img src="Images/pakistan_flag.png" alt="rightFlag" class="hidden sm:block fixed top-6 right-6 w-24 md:w-32 transform rotate-12 opacity-80 pointer-events-none drop-shadow-md z-0" />

    <!--Form background-->

    <div class="relative z-10 bg-white/95 backdrop-blur-sm shadow-2xl rounded-2xl p-6 md:p-8 w-full max-w-xl animate-fade-in border-t-4 border-pakistan-gold"> 
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-tight text-emerald-900 md:text-5xl">PSA Event RSVP</h1>
            <p class="text-md text-pakistan-gold font-bold tracking-widest uppercase mt-2">Hofstra Pakistani Students Association</p>
            <div class="w-24 h-1 bg-pakistan-gold mx-auto mt-4 rounded-full"></div>
        </div>

        <!--Countdown Timer for Form Submission-->

        <div id="countdown" class="text-center text-lg font-bold bg-emerald-50 text-emerald-900 py-3 px-6 rounded-full shadow-sm max-w-max mx-auto my-6 border border-emerald-100 transition-all duration-300">
        </div>

        <!--RSVP Form-->

        <form id="rsvpForm" class="space-y-6">
            
            <!--Input for first name-->
            <div>
                <label for="fname" class="block text-md font-black uppercase tracking-wide text-gray-700 mb-2">First Name</label> 
                <input type="text" id="fname" name="fname" placeholder="Enter first name" required 
                    class="w-full border border-gray-300 bg-gray-50/50 p-3.5 text-lg rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-800 focus:border-transparent transition-all duration-300" />
            </div>

            <!--Input for last name-->
            <div>
                <label for="lname" class="block text-md font-black uppercase tracking-wide text-gray-700 mb-2">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Enter last name" required 
                    class="w-full border border-gray-300 bg-gray-50/50 p-3.5 text-lg rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-800 focus:border-transparent transition-all duration-300" />
            </div>

            <!--Input for hofstra ID -->
            <div>
                <label for="hofstraId" class="block text-md font-black uppercase tracking-wide text-gray-700 mb-2">Hofstra ID</label>
                <input type="text" id="hofstraId" name="hofstraId" placeholder="h123456789" pattern="^h\d{9}$" required 
                    class="w-full border border-gray-300 bg-gray-50/50 p-3.5 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-800 focus:border-transparent transition-all duration-300 font-mono text-lg" />
            </div>
            
            <!--Input for email address-->
            <div>
                <label for="email" class="block text-md font-black uppercase tracking-wide text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="@pride.hofstra.edu" pattern=".+@pride\.hofstra\.edu" 
                    class="w-full border border-gray-300 bg-gray-50/50 p-3.5 text-lg rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-800 focus:border-transparent transition-all duration-300" />
            </div>

            <!--Dropdown for guest selection-->
            <div>
                <label for="statusSelect" class="block text-md font-black uppercase tracking-wide text-gray-700 mb-2">Are you bringing guests?</label>
                <select name="status" id="statusSelect" required 
                    class="w-full border border-gray-300 bg-gray-50/50 p-3.5 text-lg rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-800 focus:border-transparent transition-all duration-300 cursor-pointer">
                    <option value="student">No, just myself</option>
                    <option value="guest">Yes, bringing guests</option>
                </select>
            </div>

            <!--Guest details section, hidden by default and shown if user selects "Yes" for bringing guests-->

            <div id="guestField" class="hidden space-y-4 bg-emerald-50/60 p-4 rounded-xl border border-emerald-100/80 mt-2">
                <p class="text-base font-black text-emerald-900 border-b border-emerald-200 pb-2 mb-2">Guest Details</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                    <!--Guest 1 details, required if user selects "Yes" for bringing guests-->
                    <div>
                        <label for="guest1fname" class="block text-md font-bold uppercase text-gray-600 mb-1">Guest 1 First Name</label>
                        <input type="text" id="guest1fname" name="guest1fname" placeholder="First Name" 
                            class="w-full border border-gray-300 bg-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-800 text-base" />
                    </div>
                    
                    <div>
                        <label for="guest1lname" class="block text-md font-bold uppercase text-gray-600 mb-1">Guest 1 Last Name</label>
                        <input type="text" id="guest1lname" name="guest1lname" placeholder="Last Name" 
                            class="w-full border border-gray-300 bg-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-800 text-base" />
                    </div>
                </div>

                <!--Guest 2 details, optional for users bringing guests-->

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div>
                        <label for="guest2fname" class="block text-md font-bold uppercase text-gray-600 mb-1">Guest 2 First Name (Opt)</label>
                        <input type="text" id="guest2fname" name="guest2fname" placeholder="First Name" 
                            class="w-full border border-gray-300 bg-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-800 text-base" />
                    </div>
                    <div>
                        <label for="guest2lname" class="block text-md font-bold uppercase text-gray-600 mb-1">Guest 2 Last Name (Opt)</label>
                        <input type="text" id="guest2lname" name="guest2lname" placeholder="Last Name" 
                            class="w-full border border-gray-300 bg-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-800 text-base" />
                    </div>
                </div>
            </div>

            <!--Submit button for form-->

            <div class="pt-4">
                <button id="submitBtn" type="submit" 
                    class="bg-emerald-950 text-white font-black tracking-wide py-4 px-6 text-xl rounded-xl hover:bg-emerald-900 w-full transition-all duration-300 shadow-md hover:shadow-emerald-950/20 active:scale-[0.99]">
                    Submit RSVP
                </button>
            </div>
        </form>
    </div>

    <!--Contact page, hidden by default and shown when user clicks contact button-->
            
    <div id="contactPage" class="fixed inset-0 bg-emerald-950/60 backdrop-blur-sm flex items-center justify-center z-50 hidden transition-all duration-300">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center relative border-b-4 border-pakistan-gold animate-fade-in mx-4">
        <button onclick="closePage()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-3xl font-semibold transition-colors">&times;</button>
        
        <h2 class="text-3xl font-black text-emerald-900 mb-6">Contact Us</h2>
        
        <div class="space-y-4 font-bold text-gray-700">
            <div class="flex items-center justify-center gap-3 bg-gray-50 p-3.5 rounded-xl">
                <img src="Images/email.jpg" alt="Email" class="w-9 h-9 rounded" />
                <a href="mailto:hofstrapsa@gmail.com" class="text-xl text-emerald-800 hover:text-pakistan-gold hover:underline transition-colors">hofstrapsa@gmail.com</a>
            </div>
            
            <div class="flex items-center justify-center gap-3 bg-gray-50 p-3.5 rounded-xl">
                <img src="Images/insta.jpg" alt="Instagram" class="w-8 h-8 rounded" />
                <a href="https://instagram.com/hofstrapsa" target="_blank" class="text-xl text-emerald-800 hover:text-pakistan-gold hover:underline transition-colors">@hofstrapsa</a>
            </div>
        </div>
    </div>
    </div>

    <!--Contact button, fixed at bottom right corner-->
    
    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="openPage()" type="button" class="bg-white hover:bg-emerald-50 text-emerald-900 p-3.5 rounded-full shadow-xl transition-all duration-300 border border-emerald-100 hover:scale-110 active:scale-95 flex items-center justify-center">
            <img src="Images/question_mark.png" alt="question" class="w-10 h-10 object-contain" />
        </button>
    </div>

    <script>
        const API_BASE = "https://rsvp-backend-5b7q.onrender.com"; // Server PORT
        
        // form expiration (hide submit button)
        const dateNow = new Date();
        const formExpire = new Date("2026-10-01T01:00:00Z");

        if (dateNow > formExpire) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add("hidden");
        }

        // script for guest selection
        document.getElementById("statusSelect").addEventListener("change", function () {
            const selected = this.value; // get value from dropdown entry
            const guestField = document.getElementById("guestField"); // reference to submitted form

            // input fields for guest names
            const guest1fname = document.getElementById("guest1fname");
            const guest1lname = document.getElementById("guest1lname");
            const guest2fname = document.getElementById("guest2fname");
            const guest2lname = document.getElementById("guest2lname");

            if (selected === "guest") { // if yes show guest fields and make guest 1 required
                guestField.classList.remove("hidden");
                guest1fname.required = true;
                guest1lname.required = true;
                guest2fname.required = false;
                guest2lname.required = false;
            } 
            else { // else all entry is hidden and requirement is removed
                guestField.classList.add("hidden");
                guest1fname.required = false;
                guest1lname.required = false;
                guest2fname.required = false;
                guest2lname.required = false;
            }
        });

        // listens for form submission
        document.getElementById("rsvpForm").addEventListener("submit", async (e) => {
            e.preventDefault(); // prevents page to reload

            const form = e.target;

            // validate manually to prevent "not focusable" error
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // collect data from form to objects
            const data = {
                fname: form.fname.value,
                lname: form.lname.value,
                email: form.email.value,
                hofstraId: form.hofstraId.value,
                status: form.status.value,
                guest1fname: form.guest1fname.value || "",
                guest1lname: form.guest1lname.value || "",
                guest2fname: form.guest2fname.value || "",
                guest2lname: form.guest2lname.value || "",
                ticketExpire: new Date("2026-08-01T00:00:00Z").toISOString(),
            };

            try {
                const resp = await fetch(`${API_BASE}/submit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await resp.json();

                if (!resp.ok) {
                    throw new Error(result.detail || result.error || "Submission failed.");
                }

                // Save server-issued id (ticket id) for success page
                localStorage.setItem("ticketId", result.id);
                window.location.href = "success.html";
            } 
            catch (err) {
                console.error(err);
                alert(err.message || "Submission failed. Please try again.");
            }
        });

        function openPage() { // open contact page
            document.getElementById("contactPage").classList.remove("hidden");
            document.getElementById("contactPage").classList.add("flex");
        }

        function closePage() { // close contact page
            document.getElementById("contactPage").classList.add("hidden");
            document.getElementById("contactPage").classList.remove("flex");
        }

        const event = new Date("2026-10-01T00:00:00Z").getTime(); // set event time
        const countdown = document.getElementById("countdown");

        const countdownTimer = setInterval(() => { // run every second to update timer
            const now = new Date().getTime(); // current time
            const timeLeft = event - now; // time left

            if (timeLeft <= 0) {
                countdown.style.display = "none"; // hide countdown
                clearInterval(countdownTimer);
                return;
            }

            // define days, hours, minutes, seconds
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((timeLeft % (1000 * 60)) / 1000);

            // Dynamically change visual badges depending on timing remaining
            let badgeColors = "bg-emerald-50 text-emerald-900 border-emerald-100";
            if (timeLeft < 1000 * 60 * 60 * 24 * 3) { // less than 3 days
                badgeColors = "bg-orange-50 text-orange-700 border-orange-200";
            }
            if (timeLeft < 1000 * 60 * 60 * 12) { // less than 12 hours
                badgeColors = "bg-amber-50 text-amber-700 border-amber-200";
            }
            if (timeLeft < 1000 * 60 * 60 * 1) { // less than 1 hour
                badgeColors = "bg-red-50 text-red-700 border-red-200 animate-pulse";
            }

            countdown.className = `text-center text-lg font-bold py-1.5 px-4 rounded-full shadow-sm max-w-max mx-auto my-4 border transition-all duration-300 ${badgeColors}`;
            countdown.innerHTML = `⏳ ${days}d ${hours}h ${mins}m ${secs}s left`; // timer text + update
        }, 1000); // update every second
    </script>
</body>
