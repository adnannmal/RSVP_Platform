<!DOCTYPE html> 

<html lang="en"> 
  
<head>   
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>RSVP Confirmed!</title> 
  <link rel="icon" type="image/png" href="Images/logo.png" /> 
  <link rel="stylesheet" href="style.css" /> <!-- Custom CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script> <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script> 
</head>

<body class="bg-gradient-to-br from-emerald-900 via-pakistan-dark to-emerald-800 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden select-none">

  <!--flag pictures-->

  <img src="Images/pakistan_flag.png" alt="leftFlag" class="hidden sm:block fixed top-6 left-6 w-24 md:w-32 transform -rotate-12 opacity-80 pointer-events-none drop-shadow-md z-0" />
  <img src="Images/pakistan_flag.png" alt="rightFlag" class="hidden sm:block fixed top-6 right-6 w-24 md:w-32 transform rotate-12 opacity-80 pointer-events-none drop-shadow-md z-0" />

  <!-- Main Confirmation Background -->
  <div class="relative z-10 bg-white/95 backdrop-blur-sm shadow-2xl rounded-2xl p-6 md:p-8 w-full max-w-xl text-center animate-fade-in border-t-4 border-pakistan-gold ticket-cutout-mask">
        
    <!-- Checkmark and Confirmation Text -->
     
    <div class="inline-flex items-center justify-center w-24 h-24 bg-emerald-50 text-emerald-900 border-2 border-emerald-100 rounded-full mb-4 shadow-sm animate-pulse">
      <span class="text-5xl font-black">✓</span>
    </div>

    <h1 class="text-4xl font-black tracking-tight text-emerald-900 md:text-5xl">You're on the list!</h1>
    <p class="text-md text-pakistan-gold font-bold tracking-widest uppercase mt-2">Hofstra Pakistani Students Association</p>
    <div class="w-24 h-1 bg-pakistan-gold mx-auto mt-4 rounded-full"></div>
        
    <p class="text-gray-600 font-medium text-lg mt-4">A confirmation email is on its way.</p>
        
    <!-- Barcode Ticket Section -->

    <div class="mt-8 pt-8 border-t-4 border-dashed border-gray-200 relative">             
      <p class="text-md font-black text-gray-400 uppercase tracking-widest mb-6">Barcode TICKET</p>
      <div id="barcode-container" class="bg-gray-50/50 border border-gray-200 p-4 rounded-xl inline-block w-full max-w-sm">
        <svg id="barcode" class="mx-auto w-full"></svg>
      </div>
            
      <p class="mt-4 text-md font-bold text-emerald-900 italic">One barcode valid for all listed guests</p>
    </div>

    <div class="pt-6">
      <button id="downloadBtn" type="button"  class="bg-emerald-950 text-white font-black tracking-wide py-4 px-6 text-xl rounded-xl hover:bg-emerald-900 w-full transition-all duration-300 shadow-md hover:shadow-emerald-950/20 active:scale-[0.99]">
        Download PDF Ticket ⬇
      </button>
      </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/success.js" defer></script>
</body>
</html>
