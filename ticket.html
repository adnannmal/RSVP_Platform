<!--Opened when ticket link from EmailJS is clicked-->

<!DOCTYPE html>

<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <title>Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!--Barcode generator-->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
  </style>
</head>

<body class="bg-green-100 min-h-screen flex flex-col items-center justify-center p-6">

    <!--Ticket Display-->

    <div id="ticket" class="text-center p-6 bg-white rounded-lg shadow-lg animate-fade-in max-w-md w-full">
        <h1 class="text-3xl font-bold text-green-700 mb-2">🎟️ Your Event Ticket</h1>
        <p class="text-gray-700 mb-4">(All names listed are on one ticket)</p>

        <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4 text-left">
            <p class="text-gray-800">
                <strong>Full Name:</strong>
                <span id="ticketName">Loading...</span>
            </p>

            <div id="guestSection" class="hidden mt-3">
                <p class="font-semibold text-gray-800">Guests:</p>
                <ul id="guestList" class="list-disc list-inside text-gray-700"></ul>
            </div>
        </div>

        <p class="mb-2 text-gray-800 font-semibold">Check-In Barcode</p>

        <!--Barcode appears here-->
        <div class="bg-gray-50 border border-gray-200 p-3 rounded-xl">
            <svg id="barcode" class="mx-auto w-full"></svg>
        </div>

        <button id="downloadPdfBtn" type="button" class="bg-green-700 text-white px-4 py-2 mt-5 rounded hover:bg-green-800 w-full font-bold">
            Download PDF Ticket
        </button>
    </div>

    <script>
        const API_BASE = "https://rsvp-backend-5b7q.onrender.com";

        let ticketId = null;
        let ticketData = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const query = new URLSearchParams(window.location.search);
            ticketId = query.get("id");

            if (!ticketId) {
                document.body.innerHTML = `
                    <p class="text-red-700 text-center font-bold">
                        ❌ Invalid ticket link.
                    </p>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/ticket/${encodeURIComponent(ticketId)}`);
                const result = await response.json();

                if (!response.ok || !result.ok) {
                    throw new Error(result.error || result.detail || "Ticket not found.");
                }

                ticketData = result.ticket;

                displayTicket();
                generateBarcode();
            }
            catch (err) {
                console.error(err);

                document.body.innerHTML = `
                    <p class="text-red-700 text-center font-bold">
                        ❌ ${err.message || "This ticket is invalid or expired."}
                    </p>
                `;
                return;
            }

            const downloadPdfBtn = document.getElementById("downloadPdfBtn");

            if (downloadPdfBtn) {
                downloadPdfBtn.addEventListener("click", downloadPDF);
            }
        });

        function displayTicket() {
            const ticketName = document.getElementById("ticketName");
            const ticketEmail = document.getElementById("ticketEmail");
            const guestSection = document.getElementById("guestSection");
            const guestList = document.getElementById("guestList");
            const ticketCodeText = document.getElementById("ticketCodeText");

            ticketName.textContent = `${ticketData.fname || ""} ${ticketData.lname || ""}`.trim();
            ticketEmail.textContent = ticketData.email || "N/A";
            ticketCodeText.textContent = ticketData.id || ticketId;

            guestList.innerHTML = "";

            const guests = [];

            if (ticketData.guest1fname || ticketData.guest1lname) {
                guests.push(`${ticketData.guest1fname || ""} ${ticketData.guest1lname || ""}`.trim());
            }

            if (ticketData.guest2fname || ticketData.guest2lname) {
                guests.push(`${ticketData.guest2fname || ""} ${ticketData.guest2lname || ""}`.trim());
            }

            if (guests.length > 0) {
                guestSection.classList.remove("hidden");

                guests.forEach((guest) => {
                    const li = document.createElement("li");
                    li.textContent = guest;
                    guestList.appendChild(li);
                });
            }
            else {
                guestSection.classList.add("hidden");
            }
        }

        function generateBarcode() {
            if (!window.JsBarcode) {
                console.error("JsBarcode failed to load.");
                return;
            }

            const barcodeValue = ticketData.id || ticketId;

            JsBarcode("#barcode", barcodeValue, {
                format: "CODE128",
                width: 2.4,
                height: 90,
                displayValue: false,
                lineColor: "#022c22",
                background: "transparent",
                margin: 8
            });
        }

        async function downloadPDF() {
            try {
                const response = await fetch(`${API_BASE}/generate-pdf?id=${encodeURIComponent(ticketId)}`);

                if (!response.ok) {
                    throw new Error("Server transmission error encountered.");
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");

                a.href = url;
                a.download = `PSA_Event_Ticket_${ticketId}.pdf`;

                document.body.appendChild(a);
                a.click();
                a.remove();

                URL.revokeObjectURL(url);
            }
            catch (err) {
                console.error(err);
                alert("Sorry, there was an error downloading your PDF ticket. Please try again later.");
            }
        }
    </script>
</body>
</html>
