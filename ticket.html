<!--Opened when ticket link from EmailJS is clicked-->

<!DOCTYPE html>

<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <title>Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!--Barcode generator-->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
  </style>
</head>

<body class="bg-green-100 min-h-screen flex flex-col items-center justify-center p-6">

    <!--Ticket Display-->

    <div id="ticket" class="text-center p-6 bg-white rounded-lg shadow-lg animate-fade-in max-w-md w-full">
        <h1 class="text-3xl font-bold text-green-700 mb-2">🎟️ Your Event Ticket</h1>
        <p class="text-gray-700 mb-4">(All names listed are on one ticket)</p>

        <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4 text-left">
            <p class="text-gray-800">
                <strong>Full Name:</strong>
                <span id="ticketName"></span>
            </p>

            <div id="guestSection" class="hidden mt-3">
                <p class="font-semibold text-gray-800">Guests:</p>
                <ul id="guestList" class="list-disc list-inside text-gray-700"></ul>
            </div>
        </div>

        <p class="mb-2 text-gray-800 font-semibold">Check-In Barcode</p>

        <!--Barcode appears here-->
        <svg id="barcode" class="mx-auto w-full"></svg>

        <p id="ticketCodeText" class="text-xs text-gray-500 mt-2 break-all"></p>
    </div>

    <script>
        const API_BASE = "https://rsvp-backend-5b7q.onrender.com";

        let ticketData = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const query = new URLSearchParams(window.location.search);
            const id = query.get("id");

            if (!id) {
                document.body.innerHTML = `
                    <p class="text-red-700 text-center font-bold">
                        ❌ Invalid ticket link.
                    </p>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/ticket/${encodeURIComponent(id)}`);
                const result = await response.json();

                if (!response.ok || !result.ok) {
                    throw new Error(result.error || result.detail || "Ticket not found.");
                }

                ticketData = result.ticket;
            }
            catch (err) {
                console.error(err);

                document.body.innerHTML = `
                    <p class="text-red-700 text-center font-bold">
                        ❌ ${err.message || "This ticket is invalid or expired."}
                    </p>
                `;
                return;
            }

            const submitPin = document.getElementById("submitPin");

            if (submitPin) {
                submitPin.addEventListener("click", checkPass);
            }

            const passInput = document.getElementById("pass");

            if (passInput) {
                passInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        checkPass();
                    }
                });
            }
        });

        async function checkPass() {
            const input = document.getElementById("pass");
            const error = document.getElementById("error");
            const authBox = document.getElementById("authUser");
            const ticketBox = document.getElementById("ticket");

            if (!input || !ticketBox || !ticketData) return;

            try {
                const response = await fetch(`${API_BASE}/verify-pin`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ pin: input.value.trim() }),
                });

                const result = await response.json();

                if (!result.ok) {
                    error?.classList.remove("hidden");
                    return;
                }

                authBox?.classList.add("hidden");

                let guestHTML = "";

                if (ticketData.guest1fname || ticketData.guest1lname) {
                    guestHTML += `<li>${ticketData.guest1fname || ""} ${ticketData.guest1lname || ""}</li>`;
                }

                if (ticketData.guest2fname || ticketData.guest2lname) {
                    guestHTML += `<li>${ticketData.guest2fname || ""} ${ticketData.guest2lname || ""}</li>`;
                }

                ticketBox.innerHTML = `
                    <div class="space-y-3 text-left">
                        <h2 class="text-2xl font-bold text-green-700 mb-2">🎟️ Event Ticket</h2>

                        <p><strong>Full Name:</strong> ${ticketData.fname || ""} ${ticketData.lname || ""}</p>
                        <p><strong>Email:</strong> ${ticketData.email || ""}</p>

                        ${
                            guestHTML
                                ? `<div>
                                    <p class="font-semibold">Guests:</p>
                                    <ul class="list-disc list-inside text-gray-700">${guestHTML}</ul>
                                </div>`
                                : `<p><strong>Guests:</strong> N/A</p>`
                        }
                    </div>
                `;

                ticketBox.classList.remove("hidden");
            }
            catch (err) {
                console.error(err);
                alert("Error verifying PIN. Please try again.");
            }
        }

        window.checkPass = checkPass;
    </script>
</body>
</html>
