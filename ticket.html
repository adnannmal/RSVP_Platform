<!--Opened when ticket link from EmailJS is clicked-->

<!DOCTYPE html>

<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <title>Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!--Barcode generator-->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
  </style>
</head>

<body class="bg-green-100 min-h-screen flex flex-col items-center justify-center p-6">

    <!--Ticket Display-->

    <div id="ticket" class="text-center p-6 bg-white rounded-lg shadow-lg animate-fade-in max-w-md w-full">
        <h1 class="text-3xl font-bold text-green-700 mb-2">🎟️ Your Event Ticket</h1>
        <p class="text-gray-700 mb-4">(All names listed are on one ticket)</p>

        <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4 text-left">
            <p class="text-gray-800">
                <strong>Full Name:</strong>
                <span id="ticketName"></span>
            </p>

            <div id="guestSection" class="hidden mt-3">
                <p class="font-semibold text-gray-800">Guests:</p>
                <ul id="guestList" class="list-disc list-inside text-gray-700"></ul>
            </div>
        </div>

        <p class="mb-2 text-gray-800 font-semibold">Check-In Barcode</p>

        <!--Barcode appears here-->
        <svg id="barcode" class="mx-auto w-full"></svg>

        <p id="ticketCodeText" class="text-xs text-gray-500 mt-2 break-all"></p>
    </div>

    <script>
        let data;

        try {
            const query = new URLSearchParams(window.location.search);
            data = JSON.parse(decodeURIComponent(query.get("data")));

            console.log("Decoded data:", data);

            // check ticket expiration

            const dateNow = new Date();
            const ticketExpire = new Date(data.ticketExpire);

            if (dateNow > ticketExpire) {
                throw new Error("Ticket expired");
            }

            console.log("Valid ticket");
        }
        catch (err) {
            document.body.innerHTML = `
                <div class="bg-white rounded-lg shadow-lg p-6 max-w-md text-center">
                    <h1 class="text-3xl font-bold text-red-700 mb-2">❌ Ticket Invalid</h1>
                    <p class="text-gray-700">This ticket has expired or could not be loaded.</p>
                </div>
            `;
            throw err;
        }

        const ticketName = document.getElementById("ticketName");
        const guestSection = document.getElementById("guestSection");
        const guestList = document.getElementById("guestList");
        const ticketCodeText = document.getElementById("ticketCodeText");

        ticketName.innerText = `${data.fname} ${data.lname}`;

        // build guest list conditionally

        if (data.guest1fname || data.guest1lname) {
            const li = document.createElement("li");
            li.innerText = `${data.guest1fname} ${data.guest1lname}`;
            guestList.appendChild(li);
        }

        if (data.guest2fname || data.guest2lname) {
            const li = document.createElement("li");
            li.innerText = `${data.guest2fname} ${data.guest2lname}`;
            guestList.appendChild(li);
        }

        if (guestList.children.length > 0) {
            guestSection.classList.remove("hidden");
        }

        // create a short barcode value for check-in scanning

        const ticketCode = `${data.hofstraId}-${data.fname}-${data.lname}`
            .replace(/\s+/g, "")
            .toUpperCase();

        ticketCodeText.innerText = ticketCode;

        // render barcode for check-in scanning

        JsBarcode("#barcode", ticketCode, {
            format: "CODE128",
            lineColor: "#000",
            width: 2,
            height: 80,
            displayValue: true,
            fontSize: 14,
            margin: 10
        });
    </script>
</body>
</html>
